<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Twilio WhatsApp Custom Activity</title><link rel="stylesheet" href="activity.css"></head><body><header><span>ATIVIDADE · WHATSAPP</span><h1>Twilio Custom Activity</h1><p>Configuração local · ainda não executada no Journey Builder</p></header><form id="config"><div class="fields"><label>Remetente Twilio WhatsApp<input name="sender" required value="whatsapp:+15005550006" pattern="whatsapp:\+[1-9][0-9]{7,14}"></label><label>Template / Content SID<input name="contentSid" required value="HX00000000000000000000000000000000" pattern="HX[0-9a-fA-F]{32}"></label><label>Binding do destinatário<input name="phone" required value="{{Event.DEMO.Phone}}"></label><label>Contact Key<input name="contactKey" required value="{{Contact.Key}}"></label></div><label>Variáveis do template (JSON)<textarea name="variables" rows="3">{"1":"{{Event.DEMO.FirstName}}"}</textarea></label><label>Atributos opcionais da Journey (JSON)<textarea name="attributes" rows="2">{"journey":"{{Event.DEMO.JourneyName}}"}</textarea></label><label>Comportamento em erro<select name="errorBehavior"><option value="stop">Falhar execução (HTTP 502)</option><option value="continue">Retornar erro e continuar (HTTP 200)</option></select></label><p class="notice">Fallback é uma política do backend. Não garante ramificação automática na Journey. Bindings DEMO são exemplos; use o Event Definition Key e os atributos reais no tenant.</p><button type="submit">Salvar configuração</button><button type="button" id="reset">Restaurar exemplo</button><p id="status" role="status"></p></form><script src="vendor/postmonger.js"></script><script src="customActivity.js"></script></body></html>
