<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flash Analytics · Preview local</title>
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body { background: #f4f4f6; }
      .shell { display: flex; height: 100%; }
      .flexnav { width: 64px; background: #121c2d; flex: none; display: flex; flex-direction: column; align-items: center; padding-top: 14px; gap: 14px; }
      .flexnav i { width: 28px; height: 28px; border-radius: 6px; background: #273149; display: block; }
      .flexnav i.on { background: #0263e0; }
      .main { flex: 1; min-width: 0; }
      @media (max-width: 700px) { .flexnav { display: none; } }
    </style>
  </head>
  <body>
    <div class="shell">
      <nav class="flexnav" aria-label="Simulação da barra lateral do Flex"><i></i><i></i><i></i><i class="on" title="Flash Analytics"></i></nav>
      <div class="main" id="root"></div>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
